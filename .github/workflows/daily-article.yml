name: Daily plumbing article
on:
  schedule:
    - cron: '0 22,23 * * *'
    # Daytime recovery checks for temporary provider outages. The Sydney-date
    # lock prevents a second article; verified/held days do not generate again.
    - cron: '0 2,4,6,8 * * *'
  workflow_dispatch:
    inputs:
      verification_only:
        description: 'Test sources, project checks and the existing live article without generating content'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-article
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check Sydney publishing window and outstanding deployments
        id: readiness
        env:
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          VERIFY_ONLY: ${{ inputs.verification_only || false }}
        run: node scripts/publish-queued-article.mjs --preflight
      - name: Prepare reviewed queued article (no AI calls)
        id: prepare
        if: steps.readiness.outputs.should_run == 'true'
        env:
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          VERIFY_ONLY: ${{ inputs.verification_only || false }}
        run: node scripts/publish-queued-article.mjs
      - if: steps.readiness.outputs.should_run == 'true'
        run: npm run typecheck && npm test && npm run build
      - name: Publish to GitHub and Vercel
        if: steps.readiness.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- data/generated-articles.json data/article-queue.json data/article-calendar-*.json data/article-publication-log.json; then exit 0; fi
          git config user.name 'Grade A Plumbing publisher'
          git config user.email 'publisher@users.noreply.github.com'
          git add data/generated-articles.json data/article-queue.json data/article-calendar-*.json data/article-publication-log.json
          git commit -m 'Record daily article preparation and editorial checks'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Flag editorial holds and retry-required failures
        if: steps.prepare.outputs.outcome == 'held' || steps.prepare.outputs.outcome == 'failed'
        run: |
          echo 'No new article published. The reason is recorded in the calendar and publication log.'
          exit 1
      - name: Verify live article
        if: steps.readiness.outputs.should_run == 'true'
        env:
          VERIFY_ONLY: ${{ inputs.verification_only || false }}
        run: node scripts/publish-queued-article.mjs --verify
      - name: Alert when reviewed queue needs replenishing
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
        run: node scripts/email-queue-status.mjs
      - name: Record verified publication
        run: |
          if git diff --quiet -- data/article-calendar-*.json data/article-publication-log.json data/article-queue-alert.json; then exit 0; fi
          git config user.name 'Grade A Plumbing publisher'
          git config user.email 'publisher@users.noreply.github.com'
          git add data/article-calendar-*.json data/article-publication-log.json
          if test -f data/article-queue-alert.json; then git add data/article-queue-alert.json; fi
          git commit -m 'Record verified article deployment'
          git pull --rebase origin main
          git push origin HEAD:main
