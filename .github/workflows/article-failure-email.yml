name: Article failure email
on:
  workflow_run:
    workflows: ['Daily plumbing article']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Email publishing alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/email-article-failure.mjs
