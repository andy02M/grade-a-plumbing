name: Daily plumbing article
on:
  schedule:
    - cron: '0 22,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-article
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Gemini key and model access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/publish-daily-article.mjs --check-key
      - name: Generate today's article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/publish-daily-article.mjs
      - run: npm run typecheck && npm test && node --test scripts/plan-article.test.mjs && npm run build
      - name: Publish to GitHub and Vercel
        run: |
          if git diff --quiet -- data/generated-articles.json data/article-calendar-*.json; then exit 0; fi
          git config user.name 'Grade A Plumbing publisher'
          git config user.email 'publisher@users.noreply.github.com'
          git add data/generated-articles.json data/article-calendar-*.json
          git commit -m 'Publish daily plumbing guide'
          git push origin HEAD:main
      - name: Verify live article
        run: node scripts/publish-daily-article.mjs --verify
      - name: Record verified publication
        run: |
          if git diff --quiet -- data/article-calendar-*.json; then exit 0; fi
          git config user.name 'Grade A Plumbing publisher'
          git config user.email 'publisher@users.noreply.github.com'
          git add data/article-calendar-*.json
          git commit -m 'Record verified article deployment'
          git push origin HEAD:main
